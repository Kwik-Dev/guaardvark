server {
    listen 5173;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend. ^~ keeps the static-asset regex below from
    # claiming API paths that end in .png, .svg and the like (screenshots,
    # outputs, uploads). Request headers, X-API-Key included, pass through.
    location ^~ /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The address the browser used, port included: the backend's
        # cross-site check compares it with the page's Origin.
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 500M;

        # LoRA import — checkpoints run up to ~2GB, above the general API cap
        # just above. Nested here because the parent is ^~: that modifier makes
        # nginx stop at this prefix and skip every regex location (including
        # this one) unless it's nested inside the prefix that matched. No URI
        # suffix on proxy_pass: for a regex location nginx forwards the
        # original URI unmodified.
        location ~ ^/api/cast-library/subjects/[0-9]+/import-lora$ {
            proxy_pass http://backend:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            client_max_body_size 2200M;
        }
    }

    # Proxy WebSocket connections
    location ^~ /socket.io/ {
        proxy_pass http://backend:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
