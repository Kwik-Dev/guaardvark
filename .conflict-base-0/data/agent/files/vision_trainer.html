<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Guaardvark Vision Trainer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: Arial, sans-serif;
    background: #f0f0f0;
    width: 1000px;
    height: 1000px;
    max-width: 1000px;
    max-height: 1000px;
    overflow: hidden;
    position: relative;
  }

  #header {
    background: #1a1a2e;
    color: #e0e0e0;
    padding: 6px 16px;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
  }
  .score { color: #4caf50; font-weight: bold; }
  .misses { color: #f44336; font-weight: bold; }

  .target {
    position: absolute;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: white;
    cursor: pointer;
    user-select: none;
  }
  .target.hit {
    background: #4caf50 !important;
    animation: pulse 0.3s ease-out;
  }

  .click-marker {
    position: absolute;
    width: 16px;
    height: 16px;
    pointer-events: none;
    z-index: 9999;
  }
  .click-marker::before, .click-marker::after {
    content: '';
    position: absolute;
    background: #f44336;
  }
  .click-marker::before {
    width: 16px; height: 2px;
    top: 7px; left: 0;
    transform: rotate(45deg);
  }
  .click-marker::after {
    width: 16px; height: 2px;
    top: 7px; left: 0;
    transform: rotate(-45deg);
  }
  .click-marker.was-hit::before, .click-marker.was-hit::after {
    background: #4caf50;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(76,175,80,0.7); }
    100% { box-shadow: 0 0 0 20px rgba(76,175,80,0); }
  }

  #arena {
    position: relative;
    width: 100%;
    height: calc(1000px - 28px);
    max-height: calc(1000px - 28px);
    overflow: hidden;
  }
</style>
</head>
<body>

<div id="header">
  <span>Vision Trainer</span>
  <span>
    Click: <span class="score" id="clicks">0</span> |
    Miss: <span class="misses" id="misses">0</span> |
    Accuracy: <span id="accuracy">0%</span>
  </span>
</div>

<div id="arena"></div>

<script>
  // Agent virtual display is 1000×1000 (Xvfb default; Gemma4 box_2d grid).
  var ARENA_PAD = 40;

  var clicks = 0, misses = 0;
  var lastX = -999, lastY = -999;
  var arena = document.getElementById('arena');

  function arenaPoint(e) {
    var rect = arena.getBoundingClientRect();
    return {
      x: e.clientX - rect.left,
      y: e.clientY - rect.top,
    };
  }

  function stats() {
    document.getElementById('clicks').textContent = clicks;
    document.getElementById('misses').textContent = misses;
    var t = clicks + misses;
    document.getElementById('accuracy').textContent = t > 0 ? Math.round(clicks / t * 100) + '%' : '0%';
  }

  function marker(x, y, hit) {
    var m = document.createElement('div');
    m.className = 'click-marker' + (hit ? ' was-hit' : '');
    m.style.left = (x - 8) + 'px';
    m.style.top = (y - 8) + 'px';
    arena.appendChild(m);
  }

  function spawn() {
    var size = 70 + Math.random() * 30;
    var colors = ['#f44336','#e91e63','#9c27b0','#673ab7','#3f51b5','#2196f3','#00bcd4','#009688','#4caf50','#ff9800'];
    var color = colors[Math.floor(Math.random() * colors.length)];

    var arenaW = arena.clientWidth;
    var arenaH = arena.clientHeight;
    var minX = ARENA_PAD;
    var minY = ARENA_PAD;
    var maxX = Math.max(minX, arenaW - size - ARENA_PAD);
    var maxY = Math.max(minY, arenaH - size - ARENA_PAD);

    var x, y, tries = 0;
    do {
      x = minX + Math.random() * (maxX - minX);
      y = minY + Math.random() * (maxY - minY);
      tries++;
    } while (tries < 30 && Math.sqrt(Math.pow(x + size/2 - lastX, 2) + Math.pow(y + size/2 - lastY, 2)) < 250);
    lastX = Math.round(x + size/2);
    lastY = Math.round(y + size/2);

    var dot = document.createElement('div');
    dot.className = 'target';
    dot.style.cssText = 'width:'+size+'px;height:'+size+'px;left:'+x+'px;top:'+y+'px;background:'+color+';font-size:'+(size/3)+'px';
    dot.textContent = Math.floor(Math.random() * 9) + 1;

    dot.addEventListener('click', function(e) {
      e.stopPropagation();
      clicks++;
      dot.classList.add('hit');
      var p = arenaPoint(e);
      marker(p.x, p.y, true);
      stats();
      dot.remove();
      spawn();
    });

    arena.appendChild(dot);
  }

  arena.addEventListener('click', function(e) {
    if (e.target === this) {
      misses++;
      var p = arenaPoint(e);
      marker(p.x, p.y, false);
      stats();
    }
  });

  spawn();
</script>
</body>
</html>
