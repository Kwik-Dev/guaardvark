name: CodeQL

# Same branch set as ci.yml: cloud-plus is the fork's mainline, main is the
# upstream mirror. (dev was the old integration branch and is deleted.)
on:
  push:
    branches: [main, cloud-plus]
  pull_request:
    branches: [main, cloud-plus]
  schedule:
    - cron: "31 7 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
